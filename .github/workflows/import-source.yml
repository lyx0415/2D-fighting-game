66576"}},"patch":{"size":385615,"sha":"77f8b0fdc9c6f932337ee00a0637ed24956bdb89","sha256":"4f1e6d3eeefc32927871b3463d1ec764838be9b4e287c04327f52fbb16ce661b","head":"9dc2d02dd4a05458b85855b9cb92f509b651b868","tree":"946453644f346e9f9ba97cd7b01adb26f32c0837"}}
          folder=Path(os.environ['RUNNER_TEMP'])/'source-import';folder.mkdir(exist_ok=True)
          def download(part):
              index,record=part
              for attempt in range(4):
                  try:
                      req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+record['sha'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'ashen-source-import','Accept':'application/vnd.github+json'})
                      with urllib.request.urlopen(req,timeout=90) as response:value=json.load(response)
                      data=base64.b64decode(value['content'])
                      digest=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                      assert len(data)==record['size'] and digest==record['sha'],'Chunk verification failed'
                      (folder/str(index)).write_bytes(data)
                      return index
                  except Exception:
                      if attempt==3:raise
                      time.sleep(2**attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for i in pool.map(download,manifest['parts'].items()):print('Verified chunk',i,flush=True)
          bundle=folder/'source.bundle'
          with bundle.open('wb') as output:
              for i in range(len(manifest['parts'])):output.write((folder/str(i)).read_bytes())
          assert bundle.stat().st_size==manifest['bytes'],'Wrong bundle size'
          assert hashlib.sha256(bundle.read_bytes()).hexdigest()==manifest['sha256'],'Bundle SHA256 mismatch'
          subprocess.run(['git','bundle','verify',str(bundle)],check=True)
          subprocess.run(['git','fetch',str(bundle),'refs/heads/main:refs/remotes/source/main'],check=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','refs/remotes/source/main')==manifest['head'],'Unexpected source head'
          assert git('rev-parse','refs/remotes/source/main^{tree}')==manifest['tree'],'Unexpected source tree'
          delta=manifest['patch']
          download(('delta',delta))
          delta_path=folder/'delta'
          assert hashlib.sha256(delta_path.read_bytes()).hexdigest()==delta['sha256'],'Delta SHA256 mismatch'
          subprocess.run(['git','bundle','verify',str(delta_path)],check=True)
          subprocess.run(['git','fetch',str(delta_path),'refs/heads/main:refs/remotes/source/main'],check=True)
          assert git('rev-parse','refs/remotes/source/main')==delta['head'],'Unexpected revised head'
          assert git('rev-parse','refs/remotes/source/main^{tree}')==delta['tree'],'Unexpected revised tree'
          subprocess.run(['git','read-tree','--reset','-u','refs/remotes/source/main'],check=True)
          # Preserve this temporary workflow unchanged; the connected owner removes it after import.
          subprocess.run(['git','checkout','HEAD','--','.github/workflows/import-source.yml'],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','HEAD','--','.github/workflows'],check=True)
          print('Source tree and bundle verified. Running release checks next.')
          PY
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm audit --registry=https://registry.npmjs.org --audit-level=high
      - run: npm test
      - run: npm run build
      - run: python scripts/verify_archive.py
      - name: Fast-forward main with both histories preserved
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          merged=$(printf 'release: 灰烬誓约 v0.13.0 手机端候选版与发布前修订\n' | git commit-tree "$tree" -p HEAD -p refs/remotes/source/main)
          git push origin "$merged:refs/heads/main"
          echo "Imported source merge: $merged" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ashen-oath-v0.13-web
          path: dist/
